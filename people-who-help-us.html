<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>People Who Help Us — Homework</title><style>:root{font-family:system-ui,sans-serif;color:#24324b;background:#f5f3ff}body{margin:0}main{max-width:790px;margin:auto;padding:22px}.hero{background:linear-gradient(125deg,#b8e8fa,#f8cde7);padding:25px;border-radius:26px}.card{background:white;padding:22px;border-radius:22px;margin:18px 0;box-shadow:0 6px 22px #37307515}h1{margin:0 0 8px;font-size:2rem}h2{font-size:1.25rem}input,select{font:inherit;padding:10px;border:2px solid #dedbf4;border-radius:12px;max-width:100%;box-sizing:border-box}select{width:100%;margin-top:7px}button{background:#6654d9;color:white;border:0;border-radius:14px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:default}.question{border-bottom:1px solid #eee;padding:13px 0}.question:last-child{border:0}.feedback{font-weight:700}.ok{color:#087d58}.bad{color:#bd3c59}.small{font-size:.88rem;color:#5e6880}.hidden{display:none}.score{font-size:2rem;font-weight:800}.tag{display:inline-block;background:#fff7ce;padding:7px 12px;border-radius:99px}</style></head><body><main><section class="hero"><span class="tag">🌟 English homework</span><h1>👩‍🚒 People Who Help Us</h1><p>Three mini-games about jobs and what people do. Ready? Let's go!</p></section><section class="card"><label for="student"><strong>Your first name or class code</strong></label><p class="small">Please don't enter your surname or email.</p><input id="student" maxlength="60" autocomplete="off" placeholder="e.g. Alex / Student 07"></section><div id="tasks"></div><section class="card"><button id="check">Check my answers ✨</button><div id="results" class="hidden" aria-live="polite"><p class="score" id="score"></p><p id="message"></p><button id="submit">📨 Submit my result</button><p class="small" id="sendStatus" aria-live="polite"></p><button id="retry" type="button" style="background:#e4ddff;color:#30236f">Try again ↻</button></div></section><p class="small">Teacher setup: enter the Apps Script Web App URL in the HTML file before publishing. Results are sent only when you press Submit.</p></main><script>
// TEACHER: Paste your Apps Script deployment URL (ending in /exec) below.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4OLhotIJwYthTjv2GFb8STKFeXjSlQhKGFKWOLALSmUEjB6Nt33bqZwV6n3B6HrB9rg/exec';
const groups=[{title:'🧩 Game 1 · Match the chunks',hint:'Choose the correct ending.',items:[['put out','fires',['fires','homework','orders']],['take care of','patients',['traffic','patients','dough']],['prepare','dough',['dough','criminals','teeth']],['take','orders',['orders','gardens','fires']],['check','homework',['homework','medicine','plants']],['catch','criminals',['patients','criminals','bread']],['water','plants',['patients','plants','bills']],['serve','food and drinks',['food and drinks','homework','trees']]]},{title:'✏️ Game 2 · Complete the sentences',hint:'Choose the missing action verb.',items:[['A firefighter ___ people.','saves',['serves','saves','bakes']],['A dentist ___ people’s teeth.','checks',['checks','plants','drives']],['A nurse ___ medicine.','gives',['takes','gives','makes']],['A police officer ___ traffic.','controls',['controls','teaches','bakes']],['A gardener ___ trees and flowers.','plants',['catches','plants','serves']],['A baker ___ bread.','bakes',['wears','bakes','saves']],['A waiter ___ the bill.','brings',['brings','checks','waters']],['A teacher ___ new things.','explains',['explains','cooks','catches']]]},{title:'🔎 Game 3 · Guess the job',hint:'Read the clues. Who is it?',items:[['I put out fires and drive a fire engine.','firefighter',['gardener','firefighter','cook']],['I fix teeth and help people with toothache.','dentist',['dentist','teacher','baker']],['I take orders and serve food and drinks.','waiter / waitress',['doctor / nurse','waiter / waitress','police officer']],['I plant trees and take care of gardens.','gardener',['gardener','baker','dentist']],['I prepare dough and make cakes and biscuits.','baker',['cook','baker','firefighter']],['I keep people safe and catch criminals.','police officer',['teacher','police officer','waiter / waitress']]]}];
const tasks=document.getElementById('tasks');let all=[];groups.forEach((g,gi)=>{let sec=document.createElement('section');sec.className='card';sec.innerHTML=`<h2>${g.title}</h2><p class="small">${g.hint}</p>`;g.items.forEach((item,ii)=>{const id=`q${gi}_${ii}`,wrap=document.createElement('div');wrap.className='question';let label=document.createElement('label');label.setAttribute('for',id);label.textContent=`${ii+1}. ${item[0]}`;let sel=document.createElement('select');sel.id=id;sel.innerHTML='<option value="">Choose an answer…</option>';item[2].forEach(v=>{let op=document.createElement('option');op.value=v;op.textContent=v;sel.appendChild(op)});let fb=document.createElement('div');fb.className='feedback';wrap.append(label,sel,fb);sec.appendChild(wrap);all.push({sel,fb,answer:item[1]})});tasks.appendChild(sec)});let checked=false;document.getElementById('check').onclick=()=>{const student=document.getElementById('student').value.trim();if(!student){alert('Please enter your first name or class code.');document.getElementById('student').focus();return}if(all.some(x=>!x.sel.value)){alert('Please answer all the questions first.');return}let score=0;all.forEach(x=>{const ok=x.sel.value===x.answer;if(ok)score++;x.fb.textContent=ok?'✓ Correct!':`✗ Correct answer: ${x.answer}`;x.fb.className='feedback '+(ok?'ok':'bad');x.sel.disabled=true});checked=true;document.getElementById('student').disabled=true;document.getElementById('check').disabled=true;document.getElementById('score').textContent=`${score} / ${all.length} ⭐`;document.getElementById('message').textContent=score===all.length?'Amazing! Perfect score! 🎉':'Well done for practising! 💪';document.getElementById('results').classList.remove('hidden');document.getElementById('submit').dataset.score=score;document.getElementById('results').scrollIntoView({behavior:'smooth'})};
document.getElementById('submit').onclick=()=>{if(!checked)return;if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(SCRIPT_URL)){document.getElementById('sendStatus').textContent='Teacher needs to connect the results sheet first.';return}const btn=document.getElementById('submit');btn.disabled=true;const data=new URLSearchParams({student:document.getElementById('student').value.trim(),homework:'People Who Help Us',score:btn.dataset.score,total:String(all.length)});const frame=document.createElement('iframe');frame.name='result_receiver';frame.style.display='none';document.body.appendChild(frame);const form=document.createElement('form');form.action=SCRIPT_URL;form.method='POST';form.target='result_receiver';form.style.display='none';for(const [k,v] of data){const i=document.createElement('input');i.name=k;i.value=v;form.appendChild(i)}document.body.appendChild(form);form.submit();document.getElementById('sendStatus').textContent='Result submitted. Ask your teacher to confirm it appears in the sheet.';form.remove()};document.getElementById('retry').onclick=()=>location.reload();
</script></body></html>
