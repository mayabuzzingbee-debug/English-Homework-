<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Costume Party • Homework</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--ink:#263450;--purple:#7957bf;--pink:#fff1f5;--cream:#fffaf1;--blue:#eaf6ff;--line:#e7e0ed;--green:#277f69}*{box-sizing:border-box}body{margin:0;background:#faf4ff;font-family:Nunito,Arial,sans-serif;color:var(--ink)}.wrap{max-width:960px;margin:auto;padding:24px 16px 80px}.hero{background:linear-gradient(125deg,#f9def0,#e9e2ff 54%,#ddf7ff);border-radius:28px;padding:32px;position:relative;overflow:hidden;box-shadow:0 10px 35px #8e68aa19}.hero h1{font-size:clamp(32px,6vw,55px);line-height:1;margin:6px 0}.hero p{font-size:17px;margin:8px 0}.tag{font-size:12px;letter-spacing:2px;font-weight:900;color:#6d4a9a}.confetti{position:absolute;right:25px;top:15px;font-size:62px;transform:rotate(12deg)}.namebox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0;padding:18px;background:white;border:2px solid #e8d9ff;border-radius:19px}.namebox label{font-weight:900}.namebox input{flex:1;min-width:190px;padding:13px 14px;border-radius:12px;border:2px solid #ddd2e9;font:inherit}.words{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 24px}.word{background:white;border:1px dashed #aa97c9;border-radius:20px;padding:7px 13px;font-weight:800}.section{background:white;border-radius:24px;margin-top:23px;padding:24px;box-shadow:0 7px 28px #53446910}.section h2{font-size:24px;margin:0 0 4px}.inst{color:#72647c;margin:0 0 17px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px}.qcard{background:#fcfbff;border:1px solid var(--line);border-radius:18px;padding:14px;position:relative}.qcard p{margin:10px 0;font-size:15px;line-height:1.5}.scene{height:130px;border-radius:15px;background:linear-gradient(140deg,#ffedf1,#eae7ff);display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}.scene:before{content:'✦   ✧   ✦';position:absolute;top:6px;color:#a48bce;letter-spacing:24px;font-size:17px}.person{font-size:68px;filter:drop-shadow(0 5px 2px #744f9820)}.prop{font-size:43px}.bubble{background:white;border:1px solid #e9dfee;border-radius:14px;padding:11px;font-weight:700;min-height:72px}.choice{display:flex;align-items:center;gap:7px;margin:5px 0;padding:9px;border-radius:10px;cursor:pointer;border:1px solid transparent}.choice:has(input:checked){background:#f0e9ff;border-color:#baa6e7}.choice input{accent-color:#7957bf}.choice.correct{background:#e5f8ee;border-color:#71b79d}.choice.wrong{background:#fff0f1;border-color:#e3a6a6}.minigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.short{background:#fff7ec;border-radius:15px;padding:15px}.short .scene{height:92px}.short select{width:100%;padding:10px;border:2px solid #dcccec;border-radius:9px;background:white;color:#263450;font:inherit}.writegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.write{background:#f5faff;border-radius:15px;padding:14px}.write textarea{width:100%;resize:vertical;min-height:80px;border:2px solid #d4e1ef;border-radius:11px;font:inherit;padding:10px}.actions{position:sticky;bottom:10px;z-index:3;background:#ffffffee;backdrop-filter:blur(10px);border:1px solid #ded2ee;border-radius:19px;margin-top:25px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 8px 32px #53446922}.btn{font:900 15px Nunito,Arial,sans-serif;border:0;border-radius:12px;padding:13px 18px;cursor:pointer}.check{background:#eee8ff;color:#62469c}.submit{background:#7957bf;color:white}.submit:disabled{opacity:.5;cursor:not-allowed}.status{font-size:14px;flex:1;min-width:190px;font-weight:700}.hint{font-size:13px;color:#74687c}.score{font-size:22px;font-weight:900;color:#277f69}.needs{outline:2px solid #e9ad46!important}.footer{font-size:12px;color:#786a80;text-align:center;margin-top:18px}@media(max-width:620px){.wrap{padding:12px 10px 75px}.section{padding:16px}.writegrid{grid-template-columns:1fr}.hero{padding:23px}.confetti{font-size:36px;right:12px}}
</style></head><body><main class="wrap"><header class="hero"><div class="tag">ENGLISH HOMEWORK • FEELINGS</div><h1>🎭 The Costume Party!</h1><p>Look at the pictures, read the stories and find the feelings.</p><span class="confetti">🎈✨</span></header><div class="namebox"><label for="student">✏️ Student's name</label><input id="student" maxlength="80" autocomplete="name" placeholder="Write your name here" required></div><div class="words" aria-label="Word bank"><span class="word">🤩 excited</span><span class="word">😬 nervous</span><span class="word">🏆 proud</span><span class="word">😞 disappointed</span><span class="word">😤 frustrated</span></div><div id="sections"></div><div class="actions"><button class="btn check" id="check">✓ Check Answers</button><span class="status" id="status" role="status">24 questions + 6 sentences</span><button class="btn submit" id="submit">📨 Submit to Teacher</button></div><p class="footer">All stories use present tense. No Past Simple or would.</p></main>
<script>
const URL='https://script.google.com/macros/s/AKfycbwDjDGnRNaa54PvDf0UDmfWJTG2H08RXNU5D__E9HoNPyQRW-mRxJHLrla8Jpj7RpA5nQ/exec';
const HOMEWORK='The Costume Party';
const feelings=['proud','disappointed','frustrated','excited','nervous'];
const tasks=[
{title:'1. Emotion Detective 🔎',instruction:'Look at each picture. Read and choose the feeling.',items:[
['👸','🏆','Mia has the best costume. Everyone loves it.','proud',feelings],['🦸','🌧️','Ben wants to go to the party, but the party is cancelled.','disappointed',feelings],['🧛','🧩','Leo wants to make a mask. He tries and tries, but it does not work.','frustrated',feelings],['🧚','🎉','Amy loves parties! The costume party starts in ten minutes!','excited',feelings],['🧙','🎤','Tom needs to sing in front of the class. Everyone is looking at him.','nervous',feelings]]},
{title:'2. Guess the Feeling 💬',instruction:'Read what the children say. Choose the feeling.',items:[
['🧑‍🚀','🚀','“I can’t wait! I want to play all the games!”','excited',feelings],['🧝','🎤','“I need to speak on stage. What if I forget my words?”','nervous',feelings],['🧑‍🎨','👗','“Look! I make my costume myself. It looks fantastic!”','proud',feelings],['🧙‍♀️','🚫','“I want to wear my witch hat, but I can’t find it anywhere.”','frustrated',feelings],['🦖','🎁','“Oh no! There is no prize for my costume.”','disappointed',feelings]]},
{title:'3. Want to or Need to? 🎀',instruction:'Read the sentences. Choose want to or need to.',items:[
['👧','🦋','I ______ be a butterfly at the party. It is my favourite costume!','want to',['want to','need to']],['🧒','🎟️','The party starts at six. We ______ arrive on time.','need to',['want to','need to']],['👩‍🎤','🎶','I love music. I ______ dance at the party!','want to',['want to','need to']],['🦸','🧵','My costume is broken. I ______ fix it before the party.','need to',['want to','need to']],['🧙','🍬','I ______ eat some cake! It looks delicious.','want to',['want to','need to']],['🧛','👞','These shoes are too small. I ______ find another pair.','need to',['want to','need to']]]},
{title:'4. Picture Stories 📖',instruction:'Look at the picture. Choose the best answer.',items:[
['👧','🦋','Lily wants to be a butterfly. Her wings do not stay on. How does she feel?','frustrated',feelings],['👧','✨','Now Lily has beautiful wings. Her friends love her costume. How does she feel?','proud',feelings],['🧑','🎉','Sam is going to his first costume party. It starts soon! How does he feel?','excited',feelings],['🧑','😟','Sam needs to speak to many new children. He is shy. How does he feel?','nervous',feelings]]},
{title:'5. How Do You Feel? 💗',instruction:'Imagine you are at the costume party. Choose the feeling.',items:[
['🥳','🎊','You want to dance, and your favourite song is playing. I feel…','excited',feelings],['👑','🏅','You make an amazing costume and get a prize. I feel…','proud',feelings],['👻','⛔','You want to go to the party, but you are ill. I feel…','disappointed',feelings],['🤹','🪡','You need to fix your costume, but you can’t do it. I feel…','frustrated',feelings]]}
];
const writing=[
['My costume','I want to be a ...'],['Getting ready','I need to ...'],['I am excited','I am excited because ...'],['I am nervous','I am nervous because ...'],['I am proud','I am proud because ...'],['A difficult moment','I feel frustrated / disappointed when ...']
];
const root=document.getElementById('sections');let answersChecked=false;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let count=0;
for(const t of tasks){let block=document.createElement('section');block.className='section';block.innerHTML='<h2>'+t.title+'</h2><p class="inst">'+t.instruction+'</p><div class="cards"></div>';const deck=block.querySelector('.cards');for(const q of t.items){let id=count++;const node=document.createElement('div');node.className='qcard';node.dataset.id=id;node.dataset.answer=q[3];node.innerHTML='<div class="scene"><span class="person" aria-hidden="true">'+q[0]+'</span><span class="prop" aria-hidden="true">'+q[1]+'</span></div><p><b>'+(id+1)+'.</b> '+esc(q[2])+'</p>'+q[4].map((option,j)=>'<label class="choice"><input type="radio" name="q'+id+'" value="'+esc(option)+'"><span>'+esc(option)+'</span></label>').join('');deck.appendChild(node)}root.appendChild(block)}
const writingSection=document.createElement('section');writingSection.className='section';writingSection.innerHTML='<h2>6. My Costume Party ✍️</h2><p class="inst">Write six short sentences. Use the sentence starters to help you. Your teacher will read them.</p><div class="writegrid">'+writing.map((w,i)=>'<label class="write"><b>'+(i+1)+'. '+w[0]+'</b><p class="hint">'+w[1]+'</p><textarea id="write'+i+'" maxlength="5000" placeholder="Write your sentence here..."></textarea></label>').join('')+'</div>';root.appendChild(writingSection);
const status=document.getElementById('status');const allCards=[...document.querySelectorAll('.qcard')];
function assess(mark){let score=0,missing=0;for(const card of allCards){const chosen=card.querySelector('input:checked');if(!chosen){missing++;}else if(chosen.value===card.dataset.answer){score++;}if(mark){card.querySelectorAll('.choice').forEach(c=>{c.classList.remove('correct','wrong');const input=c.querySelector('input');if(input.checked)c.classList.add(input.value===card.dataset.answer?'correct':'wrong')});card.classList.toggle('needs',!chosen)}}return {score,missing,total:allCards.length}}
function written(){return writing.map((w,i)=>({label:w[0],answer:document.getElementById('write'+i).value.trim()}))}
function showScore(){const a=assess(true);answersChecked=true;const missingWriting=written().filter(x=>!x.answer).length;status.innerHTML='<span class="score">'+a.score+' / '+a.total+'</span> correct'+(a.missing?' · '+a.missing+' unanswered':'')+(missingWriting?' · '+missingWriting+' sentences missing':'');return a}
document.getElementById('check').onclick=()=>{showScore();window.scrollTo({top:document.querySelector('.actions').offsetTop-220,behavior:'smooth'})};
allCards.forEach(c=>c.addEventListener('change',()=>{answersChecked=false;status.textContent='Answers changed. Check again before submitting.'}));
const submit=document.getElementById('submit');submit.onclick=async()=>{const student=document.getElementById('student').value.trim();const a=showScore();if(!student){document.getElementById('student').focus();status.textContent='Please write your name first.';return}if(a.missing){status.textContent='Please answer all '+a.missing+' remaining questions.';return}const answers=written();if(answers.some(x=>!x.answer)){const first=writing.findIndex((w,i)=>!answers[i].answer);document.getElementById('write'+first).focus();status.textContent='Please complete all six sentences.';return}submit.disabled=true;submit.textContent='Sending…';const data=new URLSearchParams({submission_type:'mixed_homework',student,homework:HOMEWORK,score:String(a.score),total:'24',answers:JSON.stringify(answers)});try{await fetch(URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:data});status.textContent='📨 Submission request sent. Ask your teacher to confirm it appears in Google Sheets.';submit.textContent='✓ Request sent';}catch(err){status.textContent='Could not send. Check your internet connection and try again.';submit.disabled=false;submit.textContent='📨 Submit to Teacher'}};
</script></body></html>
