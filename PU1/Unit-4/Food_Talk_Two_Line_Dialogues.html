let answers=data.map(()=>[null,null]);
function render(){let grid=document.getElementById('grid');grid.innerHTML='';data.forEach((d,i)=>{let section=document.createElement('section');section.className='scene';let pic=document.createElement('div');pic.className='picture';pic.innerHTML='<img alt="Children sharing '+d.food+'" src="'+d.img+'"><span class="num">'+(i+1)+'</span>';section.append(pic);let inside=document.createElement('div');inside.className='inside';for(let j=0;j<2;j++){let s=document.createElement('div');s.className='slot'+(answers[i][j]!==null?' filled':'');s.tabIndex=0;s.setAttribute('role','button');s.textContent=answers[i][j]===null?'Tap a phrase below':d.choices[answers[i][j]];s.onclick=()=>{answers[i][j]=null;render()};s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();s.click()}};inside.append(s)}let choices=document.createElement('div');choices.className='choices';d.choices.forEach((phrase,k)=>{let b=document.createElement('button');b.className='choice'+(answers[i].includes(k)?' used':'');b.textContent=phrase;b.disabled=answers[i].includes(k);b.onclick=()=>{let j=answers[i].findIndex(x=>x===null);if(j<0)j=1;answers[i][j]=k;document.getElementById('result').textContent='';render()};choices.append(b)});inside.append(choices);section.append(inside);grid.append(section)})}
function check(){let count=0;document.querySelectorAll('.scene').forEach((scene,i)=>{scene.querySelectorAll('.slot').forEach((slot,j)=>{let ok=answers[i][j]!==null&&data[i].choices[answers[i][j]]===data[i].answer[j];slot.classList.add(ok?'correct':'wrong');if(ok)count++})});document.getElementById('result').textContent=count+' / 20 correct phrases'+(count===20?' 🎉 Great job!':' — try again!')}
function resetGame(){answers=data.map(()=>[null,null]);document.getElementById('result').textContent='';render()}render();
