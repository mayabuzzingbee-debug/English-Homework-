["Would you like some cookies?","No, thank you."],
["Would you like some salad?","Yes, please."],
["Would you like some bread?","Yes, please."],
["Would you like some soup?","No, thank you."],
["Would you like some orange juice?","Yes, please."],
["Would you like some fruit?","Yes, please."],
["Would you like some vegetables?","No, thank you."],
["Can I have some cheese, please?","Here you are."],
["Can I have some rice, please?","Here you are."],
["Would you like some cake?","Yes, please."]
];
const coords=[[[6,5],[52,13]],[[8,5],[53,16]],[[6,5],[54,12]],[[8,5],[54,12]],[[8,5],[54,12]],[[7,5],[53,15]],[[7,5],[54,12]],[[8,5],[53,12]],[[8,5],[54,12]],[[7,5],[54,12]]];
let answers=Array(20).fill(null),selected=null,checked=false;
const comic=document.getElementById('comic'),bank=document.getElementById('bank');
const phrases=lines.flat().map((t,id)=>({t,id}));
const shuffled=[...phrases].sort((a,b)=>((a.id*17)%23)-((b.id*17)%23));
function render(){
 comic.innerHTML='';
 imgs.forEach((url,p)=>{
  let card=document.createElement('div');card.className='panel';
  let img=document.createElement('img');img.src=url;img.alt='Anime food conversation '+(p+1);card.append(img);
  let badge=document.createElement('div');badge.className='badge';badge.textContent=p+1;card.append(badge);
  for(let j=0;j<2;j++){
   let id=p*2+j,slot=document.createElement('div');
   slot.className='slot '+(answers[id]===null?'empty':'filled');
   slot.style.setProperty('--x',coords[p][j][0]+'%');slot.style.setProperty('--y',coords[p][j][1]+'%');
   slot.textContent=answers[id]===null?'Tap here':phrases[answers[id]].t;
   slot.setAttribute('role','button');slot.tabIndex=0;
   slot.onclick=()=>put(id);
   slot.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();put(id)}};
   slot.ondragover=e=>e.preventDefault();
   slot.ondrop=e=>{e.preventDefault();let raw=e.dataTransfer.getData('text/plain');if(raw==='')return;let v=Number(raw);if(Number.isInteger(v)&&v>=0&&v<20){selected=v;put(id)}};
   if(checked)slot.classList.add(answers[id]===id?'correct':'wrong');card.append(slot);
  }
  comic.append(card);
 });
 bank.innerHTML='';
 shuffled.forEach(({id,t})=>{
  let chip=document.createElement('button');chip.className='chip'+(answers.includes(id)?' used':'')+(selected===id?' selected':'');
  chip.textContent=t;chip.draggable=true;
  chip.ondragstart=e=>e.dataTransfer.setData('text/plain',id);
  chip.onclick=()=>{selected=selected===id?null:id;render()};bank.append(chip);
 });
 document.getElementById('progress').textContent=answers.filter(x=>x!==null).length+' / 20 phrases placed';
}
function put(id){checked=false;if(selected!==null){let old=answers.indexOf(selected);if(old>=0)answers[old]=null;answers[id]=selected;selected=null}else if(answers[id]!==null){selected=answers[id];answers[id]=null}document.getElementById('notice').textContent='';render()}
document.getElementById('check').onclick=()=>{checked=true;render();let count=answers.filter((x,i)=>x===i).length;document.getElementById('notice').textContent=count===20?'🌟 Fantastic! All 20 phrases are correct!':'You got '+count+' out of 20 correct. Red boxes need another try.'};
document.getElementById('reset').onclick=()=>{answers.fill(null);selected=null;checked=false;document.getElementById('notice').textContent='';render()};
render();</script></body></html>
